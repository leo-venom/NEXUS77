<!DOCTYPE html>
<!-- NEXUS77 - referencia estatica (tema ciano hardcoded).
     No app, Html.welcomePage() gera este layout com o tema ativo injetado. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NEXUS77</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0B0F14;color:#E8F0F5;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 22px;gap:6px;overflow:hidden}
.scene{width:120px;height:120px;perspective:600px;margin-bottom:12px}
.cube{width:80px;height:80px;margin:20px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.face{position:absolute;top:0;left:0;right:0;bottom:0;border:2px solid #00E5FF;background:#00E5FF14;box-shadow:0 0 18px #00E5FF8C inset;border-radius:4px}
.f1{transform:translateZ(40px)}
.f2{transform:rotateY(180deg) translateZ(40px)}
.f3{transform:rotateY(90deg) translateZ(40px)}
.f4{transform:rotateY(-90deg) translateZ(40px)}
.f5{transform:rotateX(90deg) translateZ(40px)}
.f6{transform:rotateX(-90deg) translateZ(40px)}
@keyframes spin{from{transform:rotateX(-18deg) rotateY(0deg)}to{transform:rotateX(-18deg) rotateY(360deg)}}
h1{font-family:'Courier New',monospace;font-size:30px;letter-spacing:.35em;text-indent:.35em;color:#00E5FF;text-shadow:0 0 24px #00E5FF8C}
.sub{color:#7C8B99;font-size:13.5px;line-height:1.6;max-width:340px}
.warn{margin-top:12px;font-size:12.5px;color:#00E5FF;background:#00E5FF14;border:1px solid #00E5FF8C;border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;max-width:360px}
.chip{border:1px solid #00E5FF8C;color:#00E5FF;background:#00E5FF14;border-radius:999px;padding:10px 14px;font-size:12.5px;font-family:'Courier New',monospace;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip:active{background:#00E5FF8C;color:#0B0F14}
</style>
</head>
<body>
<div class="scene"><div class="cube"><div class="face f1"></div><div class="face f2"></div><div class="face f3"></div><div class="face f4"></div><div class="face f5"></div><div class="face f6"></div></div></div>
<h1>NEXUS77</h1>
<p class="sub">Descreva um comando e eu construo a pagina - HTML vivo, direto no seu bolso.</p>
<div class="warn">referencia estatica - a versao do app injeta o tema ativo</div>
<div class="chips">
<button class="chip" data-p="criar cubo html 3d">criar cubo html 3d</button>
<button class="chip" data-p="relogio digital neon">relogio digital neon</button>
<button class="chip" data-p="sistema solar interativo">sistema solar interativo</button>
<button class="chip" data-p="particulas conectadas">particulas conectadas</button>
<button class="chip" data-p="dashboard de energia">dashboard de energia</button>
</div>
<script>
function pick(p){
  try{ Nexus77.setInput(p); return; }catch(e){}
  try{ navigator.clipboard.writeText(p); }catch(e){}
}
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){ pick(c.getAttribute('data-p')); });
});
</script>
</body>
</html>
